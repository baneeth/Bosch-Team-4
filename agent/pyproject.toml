[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-agent"
version = "0.2.0"
description = "AI-driven chaos engineering agent for Online Boutique on Kubernetes (Chaos Mesh, OpenAI Agents SDK)"
requires-python = ">=3.11"
dependencies = [
  "kubernetes>=31",
  "httpx>=0.27",
  "pydantic>=2.9",
  "typer>=0.12",
  "rich>=13",
  "openai-agents>=0.23,<0.24",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chaos-agent = "chaos_agent.cli:app"

[tool.setuptools.packages.find]
include = ["chaos_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
